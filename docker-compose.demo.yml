# Stack do demo público. Sobe com:
#   docker-compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Cada visitante recebe um banco SQLite próprio, copiado da semente.
services:
  backend:
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env}
      # Precisa incluir localhost/127.0.0.1: o healthcheck herdado do
      # docker-compose.yml faz curl em http://localhost:8000/health/ de
      # dentro do próprio container, e o Django rejeita (400) qualquer Host
      # fora de ALLOWED_HOSTS. Sem isso o healthcheck nunca fica healthy e o
      # frontend (que depende de backend: condition: service_healthy) não sobe.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      - DEMO_DIR=/app/data/demos
      - DEMO_SEED=/app/data/seed.sqlite3
      - DEMO_MAX_BANCOS=${DEMO_MAX_BANCOS:-200}
    # Workers sync e sem --threads: DemoDatabaseMiddleware troca o banco da
    # conexão por processo, e threads fariam dois visitantes compartilhá-la.
    command: >
      sh -c "python manage.py collectstatic --noinput
      && python manage.py build_seed
      && gunicorn uairoute.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env}
      - BACKEND_URL=http://backend:8000
      - SERVER_IP=${SERVER_IP:-localhost}
      - ORS_API_KEY=${ORS_API_KEY:-}
    command: gunicorn uairoute:app --bind 0.0.0.0:5000 --workers 3

  demo-cleanup:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uairoute-demo-cleanup
    volumes:
      - backend_data:/app/data
    environment:
      - DEMO_DIR=/app/data/demos
      - DEMO_MAX_BANCOS=${DEMO_MAX_BANCOS:-200}
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env}
      - DEBUG=False
    networks:
      - uairoute-network
    restart: unless-stopped
    command: >
      sh -c "while true; do python manage.py limpar_demos --idade-horas 24; sleep 3600; done"
