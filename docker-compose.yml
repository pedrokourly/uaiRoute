services:
  # Backend Django
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uairoute-backend
    # Sem `ports`: o backend é serviço interno. A API não tem autenticação
    # própria -- quem alcança a porta 8000 cria administradores à vontade.
    # Quem fala com ele é o Flask, por http://backend:8000 dentro da rede.
    volumes:
      # Volume nomeado: o banco vive dentro dele (DATABASE_PATH abaixo).
      # Não use bind mount de arquivo aqui — em um clone limpo o db.sqlite3
      # não existe no host e o Docker criaria um diretório vazio no lugar.
      - backend_data:/app/data
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1
      - DATABASE_PATH=/app/data/db.sqlite3
      - ORS_API_KEY=${ORS_API_KEY:-}
    networks:
      - uairoute-network
    restart: unless-stopped
    healthcheck:
      # Rota dedicada, que não consulta o banco. Não use um endpoint de dados
      # aqui: na branch demo eles exigem um header de sessão que o healthcheck
      # não tem como enviar.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend Flask
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: uairoute-frontend
    ports:
      - "5000:5000"
    environment:
      - SERVER_IP=backend
      - DEBUG=True
      - BACKEND_URL=http://backend:8000
      - ORS_API_KEY=${ORS_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uairoute-network
    restart: unless-stopped

volumes:
  backend_data:

networks:
  uairoute-network:
    driver: bridge
